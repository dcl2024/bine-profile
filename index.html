<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="尹小博 Bine｜迪咔路新型膜事业部" />
  <title>尹小博 Bine｜迪咔路新型膜事业部</title>
  <style>
    :root { --blue:#182f8f; --pink:#d50070; --ink:#171821; --muted:#696b78; --paper:rgba(255,255,255,.86); }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px;
      color: var(--ink); font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif;
      background: radial-gradient(circle at 10% 10%,rgba(24,47,143,.22),transparent 32%), radial-gradient(circle at 90% 90%,rgba(213,0,112,.2),transparent 35%), #f4f4f8;
    }
    .card {
      position: relative; width: min(820px,100%); padding: clamp(34px,7vw,70px); overflow: hidden;
      border: 1px solid rgba(23,24,33,.08); border-radius: 30px; background: var(--paper);
      box-shadow: 0 30px 90px rgba(21,26,58,.16); backdrop-filter: blur(18px);
    }
    .card::before { content:""; position:absolute; inset:0 0 auto; height:8px; background:linear-gradient(90deg,var(--blue) 0 42%,#fff 42% 43%,var(--pink) 43%); }
    .eyebrow { margin:0 0 22px; color:var(--blue); font-size:13px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(46px,9vw,80px); font-weight:800; letter-spacing:-.055em; line-height:1; }
    h1 span { color:var(--pink); font-weight:500; }
    .role { max-width:660px; margin:22px 0 0; color:var(--muted); font-size:clamp(18px,2.7vw,23px); line-height:1.6; }
    .company { margin-top:10px; color:var(--ink); font-size:14px; line-height:1.7; }
    .services { display:flex; flex-wrap:wrap; gap:9px; margin:32px 0 38px; padding:0; list-style:none; }
    .services li { padding:9px 13px; border:1px solid rgba(24,47,143,.14); border-radius:999px; color:var(--blue); background:rgba(24,47,143,.05); font-size:13px; font-weight:650; }
    .contact { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding-top:26px; border-top:1px solid rgba(23,24,33,.1); }
    a { display:flex; align-items:center; justify-content:space-between; padding:15px 17px; border-radius:13px; color:var(--ink); background:rgba(23,24,33,.04); font-size:14px; text-decoration:none; transition:transform .2s ease,color .2s ease,background .2s ease; }
    a::after { content:"↗"; color:var(--pink); }
    a:hover { transform:translateY(-2px); color:var(--blue); background:rgba(24,47,143,.08); }
    @media (max-width:620px) { body{padding:14px}.card{border-radius:22px}.contact{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Decarlu · New Film Business</p>
    <h1>尹小博 <span>/ Bine</span></h1>
    <p class="role">迪咔路新型膜事业部｜新型功能膜与表面保护解决方案</p>
    <p class="company">广州迪咔路科技服务有限公司<br>滁州云林数码影像耗材有限公司</p>
    <ul class="services" aria-label="主营产品">
      <li>生态家居环保膜</li><li>TPU / TPH 漆面保护膜</li><li>TPU 彩色车衣膜</li>
      <li>汽车漆面包覆膜</li><li>汽车窗户隔热膜</li><li>渐变彩绘喷绘膜</li>
    </ul>
    <nav class="contact" aria-label="联系方式">
      <a href="tel:+8613615506555">+86 136 1550 6555</a>
      <a href="mailto:1293276495@qq.com">1293276495@qq.com</a>
      <a href="https://wa.me/8613615506555" target="_blank" rel="noreferrer">WhatsApp</a>
      <a href="https://www.decarlu.com" target="_blank" rel="noreferrer">www.decarlu.com</a>
    </nav>
  </main>
</body>
</html>
